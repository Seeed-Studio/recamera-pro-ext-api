# ext_appmgr.conf -- reCamera Pro App Center nginx edge (APP_CENTER_PORT_DESIGN §4.2)
#
# Loaded automatically by `include ext_*.conf;` in common_relay.conf, which is
# itself included inside the `server { listen 80; }` block -- so the bare
# `location` blocks below land in server context. This file ONLY ADDS new
# locations; it never edits nginx.conf / common_relay.conf or any official conf.
#
# Master copy lives in /userdata (survives OTA); S94appmgr re-injects it to
# /oem/usr/etc/nginx/ on boot. Validate with the full synthetic config:
#     nginx -t   (must pass)  then  nginx -s reload
# If reload fails, delete this file and reload again to restore.
#
# Auth model (codex-approved): static SPA shell is ANONYMOUS (no secrets in it);
# every dynamic endpoint below is JWT-gated via `auth_request /_jwt_verify`
# (reusing the official entry.cgi verifier, which reads the same-origin cookie
# `token` set by the dashboard login). The browser attaches that cookie
# automatically on same-origin fetch / WebSocket / <img> / <video> requests, so
# no Bearer header is needed. auth_request runs BEFORE the WebSocket Upgrade
# handshake, so gating the results WS and the go2rtc proxy does not break the
# upgrade -- a missing/invalid cookie is rejected with 401 before any proxy_pass.
# Endpoints gated: /api/appMgr/ (management), /appcenter/ws/results (detection
# WS), /appcenter/go2rtc/ (video). Only the static SPA shell stays anonymous.

# --- App Center SPA (static shell, anonymous) ------------------------------- #
# ⚠️ LEGACY (2026-08-12): this static SPA shell is SUPERSEDED by the official
# web-native React page /app-center (recamera_web_react). Kept for reference /
# standalone fallback; do NOT treat market/spa as the current deployment front
# end (see market/spa/DEPRECATED.md). The dynamic routes below (/appcenter/ws/
# results, /appcenter/go2rtc/, /api/appMgr/) remain the live appmgr backend and
# are still in use -- do not remove them.
location /appcenter/ {
    alias /userdata/local/appcenter/www/;
    try_files $uri $uri/ /appcenter/index.html;
    add_header Cache-Control "no-cache";
}

# --- App packages + install catalog (official "integrated" device layout) --- #
# Aligns the repo edge conf with the authoritative post-integration layout the
# live device actually serves: install packages under /appcenter/apps/ and the
# catalog at /appcenter/catalog.json. Longer/exact locations below win over the
# /appcenter/ SPA prefix above. Matches gen_catalog.py's device-local base
# (DEFAULT_BASE_URL=/appcenter/apps/) -> the browser fetches packages from here
# in the local/offline fallback path (production dist is CDN, see publishing §6).
#
# NOTE: the device's own official conf is authoritative; if it already ships
# these locations this block is a harmless repo-side alignment reference (it only
# ADDS locations, never edits official conf). Keep it in sync with the device.
#
# Packages: /appcenter/apps/<file>.tar.gz  ->  /userdata/local/appcenter/apps/
location /appcenter/apps/ {
    alias /userdata/local/appcenter/apps/;
    add_header Cache-Control "no-cache";
}
# Catalog: served at /appcenter/catalog.json -> /userdata/local/catalog/ (the
# integrated layout keeps the catalog in its own dir, not under appcenter/).
location = /appcenter/catalog.json {
    alias /userdata/local/catalog/catalog.json;
    add_header Cache-Control "no-cache";
}

# --- Detection results WebSocket (yolo-detector ResultSink :8124) ----------- #
# Longer prefix than /appcenter/ so it wins prefix matching regardless of order.
location /appcenter/ws/results {
    auth_request /_jwt_verify;                 # cookie `token`, same as /api/appMgr/
    proxy_pass http://127.0.0.1:8124;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400;
}

# --- go2rtc video reuse (official stream on :1984, sub = 640x480) ----------- #
# SPA polls /appcenter/go2rtc/api/frame.jpeg?src=sub for the live preview.
location /appcenter/go2rtc/ {
    auth_request /_jwt_verify;                 # cookie `token`, same as /api/appMgr/
    proxy_pass http://127.0.0.1:1984/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400;
}

# --- App Center management API (the ONLY JWT boundary) ---------------------- #
location /api/appMgr/ {
    auth_request /_jwt_verify;                 # reuse entry.cgi JWT verification
    proxy_pass http://127.0.0.1:8130;
    proxy_read_timeout 200s;                   # install/switch can be slow
    client_max_body_size 256m;                 # tar.gz upload headroom
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
