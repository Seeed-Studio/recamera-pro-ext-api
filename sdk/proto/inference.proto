syntax = "proto3";

// Enum mirrors rc_task_type in rc_infer.h
enum TaskType {
  TASK_TYPE_CLASSIFICATION = 0;
  TASK_TYPE_DETECTION = 1;
  TASK_TYPE_SEGMENTATION = 2;
  TASK_TYPE_TRACKING = 3;
  TASK_TYPE_KEYPOINTS = 4;
}

message InferenceBox {
  // CHANGED: coordinates switched from int32 -> float to match Box_result (float) in rc_infer.h
  float left = 1;
  float top = 2;
  float right = 3;
  float bottom = 4;
}

message InferencePoint {
  // CHANGED: keypoint coordinates int32 -> float to match Point_result (float) in rc_infer.h
  float x = 1;
  float y = 2;
  // CHANGED: added score and keypoint_id to mirror Point_result in rc_infer.h.
  // score is the keypoint confidence (not object confidence); keypoint_id refers
  // to the caller-owned keypoint schema and is unique within an instance.
  float score = 3;
  int32 keypoint_id = 4;
}

// Detection results (corresponds to rc_result_detection)
message InferenceDetectionEntry {
  InferenceBox box = 1;
  float score = 2;
  int32 class_id = 3;
  string class_name = 4;
}

message InferenceDetectionResult {
  repeated InferenceDetectionEntry entries = 1;
}

// Classification results (corresponds to rc_result_classification)
message InferenceClassificationEntry {
  float score = 1;
  int32 class_id = 2;
  string class_name = 3;
  // Optional: source ROI box when the classification is region-scoped
  // (e.g. per-face attributes). Absent for whole-frame classification.
  InferenceBox box = 4;
}

message InferenceClassificationResult {
  repeated InferenceClassificationEntry entries = 1;
}

// Segmentation results (corresponds to rc_result_segmentation)
message InferenceSegmentationEntry {
  InferenceBox box = 1;           // Optional: ROI box if available
  float score = 2;
  int32 class_id = 3;
  string class_name = 4;
  bytes mask = 5;        // Flattened mask buffer (row-major)
  int32 mask_width = 6;
  int32 mask_height = 7;
}

message InferenceSegmentationResult {
  repeated InferenceSegmentationEntry entries = 1;
}

// Tracking results (corresponds to rc_result_tracking)
message InferenceTrackingEntry {
  InferenceBox box = 1;
  float score = 2;
  int32 class_id = 3;
  string class_name = 4;
  int32 track_id = 5;
}

message InferenceTrackingResult {
  repeated InferenceTrackingEntry entries = 1;
}

// Keypoints results (corresponds to rc_result_keypoints)
// CHANGED: rc_result_keypoints now groups points per detected object instance
// (rc_keypoint_instance) instead of a flat point list. An instance carries the
// object box/score/class plus its keypoints; each point's keypoint_id refers to
// the caller-owned keypoint schema (point names/skeleton edges stay there).
message InferenceKeypointInstance {
  // Object-level fields (class + box). Some keypoint models emit no object box,
  // only keypoints: when the source rc_result_keypoints.has_box == 0 the whole
  // object_info oneof is left unset, so these four fields are omitted on the
  // wire as a group. Consumers must treat a missing object_info as "no box"
  // and skip box/label drawing.
  oneof object_info {
    InferenceObjectInfo object = 1;
  }
  repeated InferencePoint points = 5;
}

// Groups the object-level (non-keypoint) fields of a keypoint instance so the
// whole group can be presence-tracked as one unit (see object_info oneof above).
message InferenceObjectInfo {
  int32 class_id = 1;     // Index in the model's object-class schema.
  string class_name = 2;  // Human-readable class name.
  float score = 3;        // Object confidence, not keypoint confidence.
  InferenceBox box = 4;
}

message InferenceKeypointsResult {
  repeated InferenceKeypointInstance instances = 1;
}

// Top-level message corresponding to rc_result
message InferenceResult {
  TaskType task_type = 1;
  int64 timestamp_ms = 2;  // Timestamp in milliseconds since epoch
  int32 model_id = 3;      // Identifier for the model that produced the result
  string source_id = 4;  // result source; "builtin" reserved for on-device inference
  uint64 pts_us = 5;      // frame PTS (CLOCK_MONOTONIC us), 0 = no frame
  oneof data {
    InferenceDetectionResult detection = 10;
    InferenceClassificationResult classification = 11;
    InferenceSegmentationResult segmentation = 12;
    InferenceTrackingResult tracking = 13;
    InferenceKeypointsResult keypoints = 14;
  }
}
