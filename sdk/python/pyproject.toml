[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "recamera-ext"
# Python API distribution version; the native C ABI/SONAME remains 1.
version = "1.4.0"
description = "Python ctypes bindings for the reCamera Pro extension API"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
# The core binding imports without NumPy. Frame.array and ProbeSample.array use
# the firmware-provided NumPy build lazily when those properties are accessed.
array = ["numpy>=1.23,<1.24"]

[tool.setuptools]
packages = ["recamera_ext"]
include-package-data = false
