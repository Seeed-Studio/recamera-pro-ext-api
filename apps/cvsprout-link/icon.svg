  <path fill="#168B67" d="M84.64 225.79 A174 174 0 0 1 406.69 169 L423.14 159.5 L420.77 239.39 L350.39 201.5 L366.85 192 A128 128 0 0 0 129.95 233.77 Z"/>
  <path fill="#3C66E4" transform="rotate(180 256 256)" d="M84.64 225.79 A174 174 0 0 1 406.69 169 L423.14 159.5 L420.77 239.39 L350.39 201.5 L366.85 192 A128 128 0 0 0 129.95 233.77 Z"/>
  <!-- A simple ring and pupil replace the concept's fine shutter blades. -->
