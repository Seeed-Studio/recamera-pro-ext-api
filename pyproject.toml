[project]
name = "recamera-pro-ext-api-workspace"
version = "0.0.0"
description = "Development workspace for the reCamera extension Python packages"
requires-python = ">=3.11,<3.12"
dependencies = []

[dependency-groups]
dev = [
    # Match the NumPy ABI/version provided by the RV1126B firmware image.
    "jinja2>=3.1,<4",
    # Validate the published manifest schema against the same fixtures as the
    # runtime validator so packagers and the device cannot disagree.
    "jsonschema>=4,<5",
    "numpy==1.23.5",
    # Host-side image/postprocess tests; target firmware provides its own cv2.
    "opencv-python-headless==4.8.1.78",
    "pytest>=7,<10",
]

[tool.uv]
# The repository root coordinates development only. The publishable artifacts
# are the two workspace members below, not a third aggregate wheel.
package = false

[tool.uv.workspace]
members = [
    "sdk/python",
    "kit",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra --strict-markers --import-mode=importlib"
pythonpath = [
    ".",
    "sdk/python",
]
testpaths = [
    "apps",
    "kit/adapters",
    "kit/tests",
    "market/appmgr/tests",
    "market/catalog",
    "sdk/tests",
]
norecursedirs = [
    ".git",
    ".venv",
    "build",
    "dist",
    "release",
]
markers = [
    "host: tests that run on the development host without an RV1126B device",
    "package: wheel build/install smoke tests",
    "device: tests that require a reCamera Pro device and extension sockets",
    "release_artifact: tests that require staged packages, models, or adjacent source repositories",
]
