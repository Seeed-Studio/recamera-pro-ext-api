name: Publish App to CDN Store

on:
  # 手动触发（可选指定单个 app，不填则自动扫描所有有版本更新的应用）
  workflow_dispatch:
    inputs:
      app_id:
        description: '指定应用目录名（例如 yolo-detector，留空则自动检测版本递增的应用）'
        required: false
        default: ''
        type: string
      package_url:
        description: '外部预构建包直链（例如 GitHub Releases 中的 <id>-<ver>-arm64.tar.gz，填入时跳过构建直接签名并发布）'
        required: false
        default: ''
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code (fetch-depth for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # 保留上一次 commit 以便比较 git diff

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install Python Dependencies
        run: uv sync

      - name: Install System Dependencies & ossutil
        run: |
          sudo apt-get update && sudo apt-get install -y openssl unzip wget
          wget -q https://gosspublic.alicdn.com/ossutil/1.7.19/ossutil-v1.7.19-linux-amd64.zip -O /tmp/ossutil.zip
          unzip -q /tmp/ossutil.zip -d /tmp/ossutil_extracted
          sudo mv /tmp/ossutil_extracted/*/ossutil64 /usr/local/bin/ossutil
          sudo chmod +x /usr/local/bin/ossutil
          rm -rf /tmp/ossutil*

      - name: Configure Credentials
        env:
          PRIV_KEY: ${{ secrets.RECAMERA_RELEASE_PRIV_KEY }}
          OSS_AK: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_SK: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          if [ -z "$PRIV_KEY" ] || [ -z "$OSS_AK" ] || [ -z "$OSS_SK" ]; then
            echo "::error::Missing required secrets: RECAMERA_RELEASE_PRIV_KEY, OSS_ACCESS_KEY_ID, or OSS_ACCESS_KEY_SECRET"
            exit 1
          fi

          mkdir -p ~/.recamera_release_key
          echo "$PRIV_KEY" > ~/.recamera_release_key/release_priv.pem
          chmod 700 ~/.recamera_release_key
          chmod 600 ~/.recamera_release_key/release_priv.pem

          cat <<EOF > ~/.ossutilconfig
          [Credentials]
          language = EN
          endpoint = oss-us-east-1.aliyuncs.com
          accessKeyID = $OSS_AK
          accessKeySecret = $OSS_SK

          [default]
          accessKeyId = $OSS_AK
          accessKeySecret = $OSS_SK
          region = oss-us-east-1
          endpoint = oss-us-east-1.aliyuncs.com
          EOF
          chmod 600 ~/.ossutilconfig

      - name: Publish External Pre-built Package
        if: inputs.package_url != ''
        env:
          PKG_URL: ${{ inputs.package_url }}
        run: |
          echo "Processing external pre-built package from: $PKG_URL"
          mkdir -p market/packaging/dist
          PKG_NAME=$(basename "$PKG_URL" | cut -d? -f1)
          if [[ "$PKG_NAME" != *-arm64.tar.gz ]]; then
            echo "::error::Package filename must end with -arm64.tar.gz (got: $PKG_NAME)"
            exit 1
          fi
          TARGET_FILE="market/packaging/dist/$PKG_NAME"
          echo "Downloading package: $PKG_URL -> $TARGET_FILE"
          curl -fSL "$PKG_URL" -o "$TARGET_FILE"
          echo "Verifying, vendor-signing and publishing to CDN store..."
          uv run python3 market/packaging/publish_app.py "$TARGET_FILE" --sign --yes
          echo "✓ Successfully verified, signed and published: $PKG_NAME"

      - name: Detect Apps to Publish
        if: inputs.package_url == ''
        id: detector
        run: |
          python3 - << 'EOF'
          import json, os, re, subprocess, sys, urllib.request

          # 1. 获取线上 CDN 当前运行的 catalog
          live_url = "https://sensecraft-statics.seeed.cc/solution-app/recamera_pro/catalog.json"
          try:
              req = urllib.request.Request(live_url, headers={"User-Agent": "curl/7.68.0"})
              with urllib.request.urlopen(req, timeout=15) as r:
                  live = json.loads(r.read())
          except Exception as e:
              print(f"Warning: could not fetch live catalog ({e}), assuming empty")
              live = {"apps": []}
          live_apps = {a["id"]: a["version"] for a in live.get("apps", [])}

          def semver(v):
              m = re.match(r"(\d+)\.(\d+)\.(\d+)", v or "")
              return tuple(int(x) for x in m.groups()) if m else (0, 0, 0)

          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          ref = os.environ.get("GITHUB_REF", "")
          manual_app = "${{ inputs.app_id }}".strip()

          to_publish = []

          # 场景 A：Tag 触发 -> 强制发该 Tag 指定的单个 app
          if ref.startswith("refs/tags/release/"):
              tag_name = ref[len("refs/tags/release/"):]
              app_id = re.sub(r"-v[0-9]+.*$", "", tag_name)
              if os.path.isdir(f"apps/{app_id}"):
                  to_publish = [app_id]
              else:
                  print(f"::error::App apps/{app_id} does not exist!")
                  sys.exit(1)

          # 场景 B：手动 workflow_dispatch 且指定了 app（支持逗号分隔多个，如: yolo-detector, qrcode-reader）
          elif manual_app:
              for app in [a.strip() for a in manual_app.split(",") if a.strip()]:
                  if os.path.isdir(f"apps/{app}"):
                      to_publish.append(app)
                  else:
                      print(f"::error::App apps/{app} does not exist!")
                      sys.exit(1)

          # 场景 C：留空时按提交 diff 自动比对版本号递增的应用
          else:
              try:
                  diff_out = subprocess.check_output(
                      ["git", "diff", "--name-only", "HEAD~1", "HEAD", "apps/"]
                  ).decode("utf-8", "replace").splitlines()
              except Exception:
                  diff_out = []

              touched_apps = set()
              for path in diff_out:
                  parts = path.split("/")
                  if len(parts) >= 2 and parts[0] == "apps":
                      app_id = parts[1]
                      if os.path.isdir(f"apps/{app_id}") and os.path.isfile(f"apps/{app_id}/manifest.json"):
                          touched_apps.add(app_id)

              print(f"Touched apps in commit: {list(touched_apps)}")

              for app_id in sorted(touched_apps):
                  try:
                      with open(f"apps/{app_id}/manifest.json") as f:
                          mf = json.load(f)
                      local_v = mf.get("version", "0.0.0")
                  except Exception as e:
                      print(f"Skipping {app_id}: invalid manifest.json ({e})")
                      continue

                  # Source directory names may change while the installed ID
                  # remains stable for upgrades and persisted configuration.
                  live_v = live_apps.get(mf["id"])
                  # 仅当版本号严格大于线上版本，或线上尚无该应用且资产齐全时，才触发发版！
                  if live_v is None:
                      # 预检模型资产是否齐全，避免半成品上架
                      chk = subprocess.run(["python3", "market/packaging/fetch_assets.py", f"apps/{app_id}"], capture_output=True)
                      if chk.returncode == 0:
                          print(f"✓ {app_id}: new application (v{local_v}) -> to publish")
                          to_publish.append(app_id)
                      else:
                          print(f"- {app_id}: new application but missing remote assets -> skipped")
                  elif semver(local_v) > semver(live_v):
                      print(f"✓ {app_id}: version bumped {live_v} -> {local_v} -> to publish")
                      to_publish.append(app_id)
                  else:
                      print(f"- {app_id}: code changed but version not bumped (local={local_v}, live={live_v}) -> skipped")

          print(f"Final apps to publish: {to_publish}")
          # 输出给下一阶段
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"apps_json={json.dumps(to_publish)}\n")
              f.write(f"count={len(to_publish)}\n")
          EOF

      - name: Build and Publish Verified Apps
        if: inputs.package_url == '' && steps.detector.outputs.count > 0
        run: |
          APPS='${{ steps.detector.outputs.apps_json }}'
          echo "Processing publishing list: $APPS"

          # 逐个发布所有符合发版条件的应用
          python3 - << EOF
          import json, subprocess, os

          apps = json.loads('''$APPS''')
          for app_dir_name in apps:
              app_dir = f"apps/{app_dir_name}"
              with open(f"{app_dir}/manifest.json") as f:
                  manifest = json.load(f)
              app_id = manifest["id"]
              print(f"\n=======================================================")
              print(f"   Building and Publishing: {app_id}")
              print(f"=======================================================")
              
              # 0. 自动拉取缺失模型/资源文件 (若已存在或已缓存则秒级跳过)
              fetch_cmd = ["uv", "run", "python3", "market/packaging/fetch_assets.py", app_dir]
              res = subprocess.run(fetch_cmd)
              if res.returncode != 0:
                  print(f"::error::Failed to fetch assets for {app_id}")
                  exit(1)

              # 0.5 验证 Manifest 和标准资源/打包/发布回归测试
              print(f"Validating manifest schema and localization for {app_id}...")
              test_cmd = ["uv", "run", "pytest", "apps/test_manifest_schema.py", "market/packaging/"]
              res = subprocess.run(test_cmd)
              if res.returncode != 0:
                  print(f"::error::Manifest validation test failed for {app_id}")
                  exit(1)

              # 1. 确定性打包
              build_cmd = ["uv", "run", "python3", "market/packaging/build.py", app_dir, "--out", "market/packaging/dist/"]
              res = subprocess.run(build_cmd)
              if res.returncode != 0:
                  print(f"::error::Build failed for {app_id}")
                  exit(1)

              # 2. 找到产物
              pkg_file = f"market/packaging/dist/{app_id}-{manifest['version']}-arm64.tar.gz"
              if not os.path.isfile(pkg_file):
                  print(f"::error::Package not found for {app_id}")
                  exit(1)

              # 3. 签名并推送到应用商店
              pub_cmd = ["uv", "run", "python3", "market/packaging/publish_app.py", pkg_file, "--sign", "--yes"]
              res = subprocess.run(pub_cmd)
              if res.returncode != 0:
                  print(f"::error::Publish failed for {app_id}")
                  exit(1)
              print(f"✓ Successfully published {app_id}!")
          EOF

      - name: No-op Notice
        if: inputs.package_url == '' && steps.detector.outputs.count == 0
        run: |
          echo "No apps have bumped versions. Nothing to publish."
