# ext_appmgr.conf -- reCamera Pro App Center nginx edge (APP_CENTER_PORT_DESIGN §4.2)
#
# Loaded automatically by `include ext_*.conf;` in common_relay.conf, which is
# itself included inside the `server { listen 80; }` block -- so the bare
# `location` blocks below land in server context. This file ONLY ADDS new
# locations; it never edits nginx.conf / common_relay.conf or any official conf.
#
# Firmware stages this file into /oem/usr/etc/nginx/. Validate edits with the
# full synthetic config:
#     nginx -t   (must pass)  then  nginx -s reload
# If reload fails, restore the previous configuration before reloading again.
#
# Auth model (codex-approved): static SPA shell is ANONYMOUS (no secrets in it);
# every dynamic endpoint below is JWT-gated via `auth_request /_jwt_verify`
# (reusing the official entry.cgi verifier, which reads the same-origin cookie
# `token` set by the dashboard login). The browser attaches that cookie
# automatically on same-origin fetch / WebSocket / <img> / <video> requests, so
# no Bearer header is needed. auth_request runs BEFORE the WebSocket Upgrade
# handshake, so gating the results WS and the go2rtc proxy does not break the
# upgrade -- a missing/invalid cookie is rejected with 401 before any proxy_pass.
# Endpoints gated: /api/app-center/v1/ (web-native management), legacy
# /api/appMgr/, /appcenter/ws/results (detection WS), and
# /appcenter/go2rtc/ (video). Only the static SPA shell and retired exact
# endpoints that return 410 without proxying stay anonymous.

# --- App Center SPA (static shell, anonymous) ------------------------------- #
# ⚠️ LEGACY (2026-08-12): this static SPA shell is SUPERSEDED by the official
# web-native React page /app-center (recamera_web_react). Kept for reference /
# standalone fallback; do NOT treat market/spa as the current deployment front
# end (see market/spa/DEPRECATED.md). The dynamic routes below (/appcenter/ws/
# results, /appcenter/go2rtc/, /api/app-center/v1/, and legacy /api/appMgr/)
# remain the live appmgr backend and are still in use -- do not remove them.
location /appcenter/ {
    alias /userdata/local/appcenter/www/;
    try_files $uri $uri/ /appcenter/index.html;
    add_header Cache-Control "no-cache";
}

# --- App packages + install catalog (official "integrated" device layout) --- #
# Aligns the repo edge conf with the authoritative post-integration layout the
# live device actually serves: install packages under /appcenter/apps/ and the
# catalog at /appcenter/catalog.json. Longer/exact locations below win over the
# /appcenter/ SPA prefix above. Matches gen_catalog.py's device-local base
# (DEFAULT_BASE_URL=/appcenter/apps/) -> the browser fetches packages from here
# in the local/offline fallback path (production dist is CDN, see publishing §6).
#
# NOTE: the device's own official conf is authoritative; if it already ships
# these locations this block is a harmless repo-side alignment reference (it only
# ADDS locations, never edits official conf). Keep it in sync with the device.
#
# Packages: /appcenter/apps/<file>.tar.gz  ->  /userdata/local/appcenter/apps/
location /appcenter/apps/ {
    alias /userdata/local/appcenter/apps/;
    add_header Cache-Control "no-cache";
}
# Catalog: served at /appcenter/catalog.json -> /userdata/local/catalog/ (the
# integrated layout keeps the catalog in its own dir, not under appcenter/).
location = /appcenter/catalog.json {
    alias /userdata/local/catalog/catalog.json;
    add_header Cache-Control "no-cache";
}

# --- Unified multi-app results WebSocket (appmgr ResultGateway :8124) ------- #
# Managed applications publish NDJSON over /run/recamera/appmgr-results.sock;
# only appmgr binds this port, so concurrent apps cannot collide on :8124.
# Longer prefix than /appcenter/ so it wins prefix matching regardless of order.
location /appcenter/ws/results {
    # Browsers always send Origin on a WebSocket handshake. WebSocket does not
    # implement CORS, so reject a non-empty foreign Origin explicitly; empty is
    # retained for authenticated non-browser diagnostic clients.
    set $recamera_appcenter_origin_ok 0;
    if ($http_origin = "") { set $recamera_appcenter_origin_ok 1; }
    if ($http_origin = "$scheme://$http_host") { set $recamera_appcenter_origin_ok 1; }
    if ($recamera_appcenter_origin_ok = 0) { return 403; }
    auth_request /_jwt_verify;                 # cookie `token`, same JWT boundary
    proxy_pass http://127.0.0.1:8124;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400;
}

# --- Canonical AI Result Hub v2 (app + built-in, loopback :8125) ------------ #
# The outer envelope is always `recamera.ai.result` v2.  Clients may send a
# masked `subscribe` message selecting raw or formatted view; templates never
# replace the raw stream.  Legacy /appcenter/ws/results above remains unchanged.
location = /ws/ai/results/v2 {
    set $recamera_ai_results_origin_ok 0;
    if ($http_origin = "") { set $recamera_ai_results_origin_ok 1; }
    if ($http_origin = "$scheme://$http_host") { set $recamera_ai_results_origin_ok 1; }
    if ($recamera_ai_results_origin_ok = 0) { return 403; }
    auth_request /_jwt_verify;
    proxy_pass http://127.0.0.1:8125;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400;
    proxy_buffering off;
}

# --- go2rtc video reuse (official stream on :1984, sub = 640x480) ----------- #
# SPA polls /appcenter/go2rtc/api/frame.jpeg?src=sub for the live preview.
location ^~ /appcenter/go2rtc/ {
    set $recamera_appcenter_origin_ok 0;
    if ($http_origin = "") { set $recamera_appcenter_origin_ok 1; }
    if ($http_origin = "$scheme://$http_host") { set $recamera_appcenter_origin_ok 1; }
    if ($recamera_appcenter_origin_ok = 0) { return 403; }
    auth_request /_jwt_verify;                 # cookie `token`, same JWT boundary
    proxy_pass http://127.0.0.1:1984/;
    proxy_http_version 1.1;
    # The firmware nginx omits ngx_http_map_module. Keep normal HTTP (frame,
    # finite MP4, etc.) non-upgrade and close its upstream connection after the
    # response; only tunnel an actual WebSocket Upgrade request.
    set $recamera_go2rtc_connection close;
    if ($http_upgrade ~* "^websocket$") { set $recamera_go2rtc_connection upgrade; }
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $recamera_go2rtc_connection;
    proxy_set_header Host $host;
    proxy_read_timeout 86400;
}

# --- App Center management API (the ONLY JWT boundary) ---------------------- #
# Web-native multi-app API. Upload bodies are passed through incrementally to
# appmgr's bounded multipart parser; SSE responses must not be coalesced by
# nginx or state changes would only arrive when a proxy buffer filled.
location /api/app-center/v1/ {
    set $recamera_appcenter_origin_ok 0;
    if ($http_origin = "") { set $recamera_appcenter_origin_ok 1; }
    if ($http_origin = "$scheme://$http_host") { set $recamera_appcenter_origin_ok 1; }
    if ($recamera_appcenter_origin_ok = 0) { return 403; }
    auth_request /_jwt_verify;
    proxy_pass http://127.0.0.1:8130;
    proxy_http_version 1.1;
    proxy_read_timeout 86400;
    proxy_send_timeout 300s;
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 256m;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite any client-supplied value. appmgr accepts unsigned packages
    # only when this post-auth edge stamp is paired with a valid browser Origin.
    proxy_set_header X-ReCamera-App-Center-Route authenticated-local-web-v1;
}

# The legacy raw upload handlers materialize the complete body in appmgr's
# memory. They remain available on loopback for controlled migration tooling,
# but must never be reachable through the public device edge. Manifest-v2 apps
# use the bounded streaming upload above and bundle/content-address artifacts.
# Exact locations take precedence over the compatibility prefix below.
location = /api/appMgr/upload {
    return 410;
}

location = /api/appMgr/putModel {
    return 410;
}

# Legacy API retained for activate/switch/query and older small-body clients.
location /api/appMgr/ {
    set $recamera_appcenter_origin_ok 0;
    if ($http_origin = "") { set $recamera_appcenter_origin_ok 1; }
    if ($http_origin = "$scheme://$http_host") { set $recamera_appcenter_origin_ok 1; }
    if ($recamera_appcenter_origin_ok = 0) { return 403; }
    auth_request /_jwt_verify;                 # reuse entry.cgi JWT verification
    proxy_pass http://127.0.0.1:8130;
    proxy_read_timeout 200s;                   # install/switch can be slow
    client_max_body_size 2m;                   # remaining legacy bodies are JSON
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
}
